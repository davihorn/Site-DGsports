<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - DG Sports</title>
    <link rel="icon" href="image.png" type="image/png">
    <!-- COLOQUE SEU CSS AQUI DENTRO (aquele de antes, sem mudanças) -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; } body { background-color: #f4f4f4; color: #333; } header { background-color: #fff; padding: 15px 50px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); } .logo img { height: 80px; } nav a { text-decoration: none; color: #000; font-weight: bold; margin-left: 20px; text-transform: uppercase; } .container-produto { display: flex; flex-wrap: wrap; max-width: 1000px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); gap: 40px; } .galeria { flex: 1; min-width: 300px; position: relative; display: flex; align-items: center; } .foto-principal { width: 100%; border-radius: 8px; object-fit: cover; } .seta { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(0, 0, 0, 0.5); color: white; border: none; padding: 15px; cursor: pointer; font-size: 18px; border-radius: 50%; transition: 0.3s; } .seta:hover { background-color: rgba(0, 0, 0, 0.8); } .seta-esquerda { left: 10px; } .seta-direita { right: 10px; } .info { flex: 1; min-width: 300px; } .info h1 { font-size: 2em; margin-bottom: 10px; } .info .preco-grande { font-size: 2.2em; color: #27ae60; font-weight: bold; margin-bottom: 20px; } .info .descricao { line-height: 1.6; margin-bottom: 20px; color: #555; } .seletor-tamanhos { margin-bottom: 25px; } .seletor-tamanhos p { font-weight: bold; margin-bottom: 10px; } .btn-tamanho { background: #fff; border: 2px solid #ccc; padding: 10px 15px; margin-right: 10px; border-radius: 4px; cursor: pointer; font-size: 1em; font-weight: bold; transition: 0.2s; } .btn-tamanho:hover { border-color: #000; } .btn-tamanho.selecionado { background: #000; color: #fff; border-color: #000; } .btn-whatsapp { display: flex; align-items: center; justify-content: center; background-color: #25D366; color: white; text-decoration: none; padding: 15px; border-radius: 5px; font-size: 1.2em; font-weight: bold; transition: 0.3s; cursor: pointer; } .btn-whatsapp:hover { background-color: #1DA851; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html"><img src="image.png" alt="Logo DG Sports"></a></div>
        <nav><a href="index.html">Voltar para a Loja</a></nav>
    </header>

    <div class="container-produto">
        <!-- GALERIA -->
        <div class="galeria">
            <button class="seta seta-esquerda" onclick="mudarFoto(-1)">&#10094;</button>
            <img id="foto-atual" src="" class="foto-principal">
            <button class="seta seta-direita" onclick="mudarFoto(1)">&#10095;</button>
        </div>
        <!-- INFORMAÇÕES -->
        <div class="info">
            <h1 id="nome-produto">Carregando...</h1>
            <p class="preco-grande" id="preco-produto">R$ 0,00</p>
            <p class="descricao" id="desc-produto">Carregando descrição...</p>
            
            <div class="seletor-tamanhos">
                <p>Escolha o Tamanho:</p>
                <button class="btn-tamanho" onclick="selecionarTamanho(this, 'P')">P</button>
                <button class="btn-tamanho" onclick="selecionarTamanho(this, 'M')">M</button>
                <button class="btn-tamanho" onclick="selecionarTamanho(this, 'G')">G</button>
                <button class="btn-tamanho" onclick="selecionarTamanho(this, 'GG')">GG</button>
            </div>
            
            <a id="link-whatsapp" href="#" class="btn-whatsapp">🛒 Comprar pelo WhatsApp</a>
        </div>
    </div>

    <script>
        // --- 1. O SEU "BANCO DE DADOS" DE CAMISAS ---
        // Toda vez que adicionar uma camisa nova, coloque ela aqui dentro!
        const catalogo = {
            "real1": {
                nome: "Camisa Real Madrid I Branca",
                preco: "R$ 149,90",
                descricao: "Qualidade premium. Tecido leve e confortável. Símbolo bordado de alta qualidade.",
                fotos: ["assets/img/real madrid/real madrid frente.jpg", "assets/img/real madrid/real madrid costas.jpg"]
            },
            "atletico1": {
                nome: "Camisa Atlético de Madrid I",
                preco: "R$ 149,90",
                descricao: "Camisa listrada clássica do Atlético. Qualidade tailandesa 1:1, perfeita para o dia a dia.",
                fotos: ["   ", "atletico madrid costas.jpg"]
            },
            "inter1": {
                nome: "Camisa Inter I",
                preco: "R$ 149,90",
                descricao: "Camisa oficial do Inter de Milão. Qualidade premium, perfeita para o dia a dia.",
                fotos: ["assets/img/inter/inter frente.jpg", "assets/img/inter/inter costas.jpg"]
            }
            // Quando quiser colocar mais, é só seguir esse modelo separando por vírgula!
        };

        // --- 2. LÓGICA PARA LER A URL E PREENCHER A TELA ---
        // Pega o "?id=nome" da barra de endereço
        const urlParams = new URLSearchParams(window.location.search);
        const idDoProduto = urlParams.get('id');
        
        // Puxa as informações do banco de dados lá de cima
        const produtoEscolhido = catalogo[idDoProduto];

        // Se o produto existir no nosso catálogo, a gente preenche a tela
        let listaDeFotos = [];
        let fotoIndex = 0;

        if (produtoEscolhido) {
            document.getElementById("nome-produto").innerText = produtoEscolhido.nome;
            document.getElementById("preco-produto").innerText = produtoEscolhido.preco;
            document.getElementById("desc-produto").innerText = produtoEscolhido.descricao;
            
            // Configura as fotos daquele produto
            listaDeFotos = produtoEscolhido.fotos;
            document.getElementById("foto-atual").src = listaDeFotos[0]; // Mostra a 1ª foto
        } else {
            // Se alguém digitar um link errado
            document.getElementById("nome-produto").innerText = "Produto não encontrado";
        }

        // --- 3. LÓGICA DE PASSAR FOTOS ---
        function mudarFoto(direcao) {
            if (listaDeFotos.length === 0) return; // Segurança
            fotoIndex += direcao;
            if (fotoIndex >= listaDeFotos.length) fotoIndex = 0;
            if (fotoIndex < 0) fotoIndex = listaDeFotos.length - 1;
            document.getElementById("foto-atual").src = listaDeFotos[fotoIndex];
        }

        // --- 4. LÓGICA DO WHATSAPP ---
        const meuNumeroWhatsApp = "5546991087501"; 
        let tamanhoEscolhido = "";

        function selecionarTamanho(botaoClicado, tamanho) {
            let botoes = document.querySelectorAll('.btn-tamanho');
            botoes.forEach(b => b.classList.remove('selecionado'));
            botaoClicado.classList.add('selecionado');
            tamanhoEscolhido = tamanho;
        }

        document.getElementById('link-whatsapp').addEventListener('click', function(event) {
            if (tamanhoEscolhido === "") {
                event.preventDefault();
                alert("Por favor, selecione um tamanho antes de comprar!");
                return;
            }
            let nomeFinal = produtoEscolhido ? produtoEscolhido.nome : "Camisa";
            let mensagem = `Olá, DG Sports! Gostaria de comprar a *${nomeFinal}*. O tamanho que eu quero é o *${tamanhoEscolhido}*.`;
            let urlFinal = `https://wa.me/${meuNumeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlFinal, '_blank');
        });
    </script>
</body>
</html>
