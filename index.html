<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Sports | Loja de Camisas</title>
    <link rel="icon" href="image.png" type="image/png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f4f4; color: #333; }
        
        /* Cabeçalho centralizado já que tiramos a barra */
        header { background-color: #fff; padding: 15px 50px; display: flex; align-items: center; justify-content: center; }
        .logo img { height: 80px; }
        
        /* Menu de Categorias Amarelo */
        .menu-categorias { background-color: #e5ff00; padding: 15px 50px; display: flex; justify-content: center; flex-wrap: wrap; gap: 30px; border-bottom: 2px solid #ccc; }
        .menu-categorias a { text-decoration: none; color: #000; font-weight: bold; text-transform: uppercase; font-size: 0.9em; transition: 0.2s; }
        .menu-categorias a:hover { opacity: 0.7; }

        .titulo-time { text-align: center; margin: 50px 0 20px; font-size: 2em; text-transform: uppercase; border-bottom: 3px solid #000; display: inline-block; padding-bottom: 5px; }
        .container-titulo { text-align: center; }
        
        .vitrine { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; padding: 0 50px 50px; max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; padding: 20px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; border-radius: 5px; margin-bottom: 15px; object-fit: cover; aspect-ratio: 1/1; }
        .card h3 { font-size: 1.2em; margin-bottom: 10px; color: #000; }
        .card .preco { font-size: 1.4em; font-weight: bold; color: #27ae60; margin-bottom: 15px; }
        .btn-detalhes { display: inline-block; background-color: #000; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; width: 100%; }
        .btn-detalhes:hover { background-color: #333; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html"><img src="image.png" alt="Logo DG Sports"></a></div>
    </header>

    <!-- MENU DE NAVEGAÇÃO -->
    <div class="menu-categorias">
        <a href="index.html">Início</a>
        <a href="time.html?clube=real">Real Madrid</a>
        <a href="time.html?clube=atletico">Atlético de Madrid</a>
    </div>

    <!-- SEÇÃO REAL MADRID -->
    <div class="container-titulo" id="real-madrid"><h2 class="titulo-time">Real Madrid</h2></div>
    <section class="vitrine">
        <div class="card">
            <img src="real madrid frente.jpg" alt="Camisa Real Madrid">
            <h3>Camisa Real Madrid I Branca</h3>
            <p class="preco">R$ 149,90</p>
            <a href="produto.html?id=real1" class="btn-detalhes">Ver Detalhes</a>
        </div>
    </section>

    <!-- SEÇÃO ATLÉTICO DE MADRID -->
    <div class="container-titulo" id="atletico-madrid"><h2 class="titulo-time">Atlético de Madrid</h2></div>
    <section class="vitrine">
        <div class="card">
            <img src="atletico madrid frente.jpg" alt="Camisa Atlético de Madrid">
            <h3>Camisa Atlético de Madrid I</h3>
            <p class="preco">R$ 149,90</p>
            <a href="produto.html?id=atletico1" class="btn-detalhes">Ver Detalhes</a>
        </div>
    </section>

</body>
</html>
