<html lang="pt-BR">
<head>

    <link rel="icon" href="assets/img/favicon.png" type="image/png">

    <!-- BIBLIOTECA DE ÍCONES (FONT AWESOME) - ISSO AQUI FALTAVA -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* RESET E LAYOUT */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #ffffff; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* CABEÇALHO */
        .top-bar { background-color: #1a1aff; color: white; text-align: center; padding: 5px 0; font-size: 0.8em; }
        .top-bar a { color: white; text-decoration: none; margin: 0 10px; }
        .top-bar a i { margin-right: 5px; font-size: 1.1em; } /* Espaço no ícone */
        
        .header-amarelo { background-color: #e5ff00; padding: 15px 50px; display: flex; align-items: center; justify-content: space-between; }
        .logo img { height: 70px; }
        
        /* CARRINHO */
        .carrinho-icon { position: relative; cursor: pointer; display: flex; align-items: center; font-weight: bold; font-size: 1.2em; }
        .carrinho-icon span { font-size: 1.5em; margin-right: 5px; }
        .badge-carrinho { position: absolute; top: -5px; right: -10px; background-color: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7em; }

        /* MENU */
        .menu-categorias { background-color: #e5ff00; padding: 10px 50px; display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; border-bottom: 2px solid #d4ec00; }
        .menu-categorias a { text-decoration: none; color: #000; font-weight: bold; text-transform: uppercase; font-size: 0.85em; transition: 0.2s; }
        .menu-categorias a:hover { opacity: 0.6; }

        /* CONTEÚDO PRINCIPAL */
        .conteudo-principal { flex: 1; }
        .titulo-secao { text-align: center; margin: 40px 0; font-size: 1.8em; font-weight: bold; text-transform: uppercase; }
        .vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 0 50px 50px; max-width: 1200px; margin: 0 auto; }
        
        /* CARD DOS PRODUTOS */
        .card { text-align: center; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background-color: #f5f5f5; margin-bottom: 15px; border-radius: 8px; }
        .card h3 { font-size: 0.9em; margin-bottom: 5px; color: #333; font-weight: normal; }
        .card .preco { font-size: 1.1em; font-weight: bold; color: #000; margin-bottom: 15px; }
        .btn-detalhes { display: inline-block; background-color: #fff; color: #000; border: 1px solid #000; text-decoration: none; padding: 8px 15px; font-size: 0.9em; font-weight: bold; width: 100%; transition: 0.3s; border-radius: 4px; }
        .btn-detalhes:hover { background-color: #000; color: #fff; }

        /* MODAL DO CARRINHO */
        .carrinho-modal { display: none; position: fixed; top: 0; right: 0; width: 350px; height: 100%; background: #fff; box-shadow: -2px 0 10px rgba(0,0,0,0.2); z-index: 1000; flex-direction: column; padding: 20px; }
        .carrinho-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 15px; }
        .fechar-carrinho { cursor: pointer; font-size: 1.5em; font-weight: bold; }
        .itens-carrinho { flex: 1; overflow-y: auto; }
        .item-cart { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9em; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
        .btn-whatsapp { display: block; text-align: center; background-color: #25D366; color: white; text-decoration: none; padding: 15px; font-weight: bold; border-radius: 5px; margin-top: 15px; cursor: pointer; border: none; width: 100%; font-size: 1em; }
        .fundo-escuro { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }

        /* RODAPÉ (FOOTER) */
        .footer { background-color: #222; color: #fff; padding: 40px 50px 20px; text-align: center; margin-top: 50px; }
        .footer-redes { margin-bottom: 20px; }
        .footer-redes a { color: #e5ff00; text-decoration: none; font-size: 1.2em; margin: 0 15px; transition: 0.3s; font-weight: bold; }
        .footer-redes a:hover { color: #fff; }
        .footer-redes a i { margin-right: 8px; } /* Espaço no ícone */
        .footer-texto { margin-top: 20px; font-size: 0.9em; color: #aaa; border-top: 1px solid #444; padding-top: 20px; line-height: 1.5; }

        /* REGRAS PARA CELULAR (Design Responsivo) */
        @media (max-width: 768px) {
            .header-amarelo { flex-direction: column; padding: 15px 20px; gap: 15px; }
            .menu-categorias { padding: 10px 15px; gap: 10px; }
            .menu-categorias a { font-size: 0.75em; }
            .vitrine { padding: 0 20px 30px; grid-template-columns: repeat(2, 1fr); gap: 10px; } 
            .carrinho-modal { width: 100%; } 
            .footer { padding: 30px 20px; }
            .footer-redes a { display: inline-block; margin: 10px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="https://www.instagram.com/dgsportsbrasil?igsi=MWloN3ltY3N1c2pvag%3D%3D&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i> Instagram</a> | 
        <a href="https://www.tiktok.com/@dgsportsbrasil?_r=1&_t=ZS-999qIlBsazR" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a> | 
        <a href="https://wa.me/5546991087501" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
    </div>
    
    <header class="header-amarelo">
        <div class="logo"><a href="index.html"><img src="assets/img/logo DGsports.png" alt="Logo DG Sports"></a></div>
        <div class="carrinho-icon" onclick="abrirCarrinho()"><span>🛒</span><div class="badge-carrinho" id="contagem-carrinho">0</div></div>
    </header>

    <div class="menu-categorias">
        <a href="index.html">Início</a>
        <a href="liga.html?liga=laliga">La Liga</a>
        <a href="liga.html?liga=premier">Premier League</a>
        <a href="liga.html?liga=brasileirao">Brasileirão</a>
        <a href="liga.html?liga=copa do mundo">2026 FIFA World Cup</a>
        <a href="liga.html?liga=ligue 1">Ligue 1</a>
        <a href="liga.html?liga=serie a">Serie A</a>
        <a href="liga.html?liga=bundesliga">Bundesliga</a>
        <a href="liga.html?liga=retro">Rêtro</a>
    </div>

    <div class="conteudo-principal">
        <h2 class="titulo-secao" id="titulo-pagina">Carregando...</h2>
        <section class="vitrine" id="vitrine-liga"></section>
    </div>

    <footer class="footer">
        <div class="footer-redes">
            <a href="https://www.instagram.com/dgsportsbrasil?igsi=MWloN3ltY3N1c2pvag%3D%3D&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="https://www.tiktok.com/@dgsportsbrasil?_r=1&_t=ZS-999qIlBsazR" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="https://wa.me/5546991087501" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        </div>
        <div class="footer-texto"><p>&copy; 2026 DG Sports - Todos os direitos reservados.</p><p>Pato Branco, Paraná - PR</p></div>
    </footer>

    <!-- CARRINHO E JS (MANTIDOS IGUAL VOCÊ MANDOU) -->
    <div class="fundo-escuro" id="fundo-escuro" onclick="fecharCarrinho()"></div>
    <div class="carrinho-modal" id="carrinho-modal">
        <div class="carrinho-header"><h2>Seu Carrinho</h2><span class="fechar-carrinho" onclick="fecharCarrinho()">X</span></div>
        <div class="itens-carrinho" id="lista-itens-carrinho"></div>
        <button class="btn-whatsapp" onclick="finalizarCompraWhatsApp()">🛒 Enviar Pedido no WhatsApp</button>
    </div>

    <script>
        const catalogo = {
            "real1": { liga: "laliga", nome: "Camisa Real Madrid I 2021/2022 Branca", preco: "R$ 219,90", foto: "assets/img/la liga/real madrid frente.jpg" },
            "atletico1": { liga: "laliga", nome: "Camisa Atlético de Madrid I 2024/2025", preco: "R$ 299,90", foto: "assets/img/la liga/atletico madrid frente.png" },
            "flamengo1": { liga: "brasileirao", nome: "Camisa Flamengo I 2026/2027", preco: "R$ 219,90", foto: "assets/img/brasileirao/flamengo 26-27 frente.jpg" },
            "brasil1": { liga: "copa do mundo", nome: "Camisa Brasil 2026 I Versão Jogador", preco: "R$ 299,90", descricao: "Camisa oficial da Seleção Brasileira para a Copa do Mundo 2026.", foto: "assets/img/copa/brasil I frente.jpg" },
            "brasil2": { liga: "copa do mundo", nome: "Camisa Brasil 2026 II Versão Jogador", preco: "R$ 299,90", descricao: "Camisa oficial da Seleção Brasileira para a Copa do Mundo 2026.", foto: "assets/img/copa/brasil II frente.jpg" },
            "espanha2": { liga: "copa do mundo", nome: "Camisa Espanha 2026 II Versão Jogador", preco: "R$ 299,90", descricao: "Camisa oficial da Seleção Espanhola para a Copa do Mundo 2026.", foto: "assets/img/copa/espanha frente II 2026.jpg" },
            "espanha1": { liga: "copa do mundo", nome: "Camisa Espanha 2026 I Versão Jogador", preco: "R$ 299,90", descricao: "Camisa oficial da Seleção Espanhola para a Copa do Mundo 2026.", foto: "assets/img/copa/espanha frente I 2026.jpg" },
            "barcelona1": { liga: "retro", nome: "Camisa Barcelona Retro 2017/2018", preco: "R$ 339,90", foto: "assets/img/retro/barcelona retro frente 17-18.jpg" },
            "barcelona2": { liga: "retro", nome: "Camisa Barcelona 2014/2015", preco: "R$ 339,90", foto: "assets/img/retro/Retro Barcelona 14-15 frente.jpg" },
            "barcelona3": { liga: "retro", nome: "Camisa Barcelona 2015/2016", preco: "R$ 339,90", foto: "assets/img/retro/Barcelona retro 15-16 frente.jpg" },
            "palmeiras1": { liga: "brasileirao", nome: "Camisa Palmeiras I 26/27 ", preco: "R$ 219,90", foto: "assets/img/brasileirao/palmeiras 26-27 frente.jpg" },
            //"real2": { liga: "laliga", nome: "Camisa Real Madrid II Azul", preco: "R$ 149,90", foto: "assets/img/la liga/real madrid frente azul.jpg" },
            "internacional1": { liga: "brasileirao", nome: "Camisa Internacional I 26/27", preco: "R$ 219,90", foto: "assets/img/brasileirao/internacional 26-27 frente.jpg" },
            "internacional2": { liga: "brasileirao", nome: "Camisa Internacional II 25/26 Black", preco: "R$ 219,90", foto: "assets/img/brasileirao/internacional 25-26 frente.jpg" },
            "internacional3": { liga: "brasileirao", nome: "Camisa Internacional II 26/27", preco: "R$ 219,90", foto: "assets/img/brasileirao/internacional 2 26-27 frente.jpg" },
            "gremio1": { liga: "brasileirao", nome: "Camisa Grêmio II 25/26", preco: "R$ 219,90", foto: "assets/img/brasileirao/gremio 2 25-26 frente.jpg" }
            
        
        
        
        
        
        
        };

        const urlParams = new URLSearchParams(window.location.search);
        const ligaEscolhida = urlParams.get('liga');
        const vitrine = document.getElementById('vitrine-liga');
        const titulo = document.getElementById('titulo-pagina');

        if (ligaEscolhida === 'laliga') titulo.innerText = "La Liga";
        else if (ligaEscolhida === 'premier') titulo.innerText = "Premier League";
        else if (ligaEscolhida === 'brasileirao') titulo.innerText = "Brasileirão";
        else titulo.innerText = "Camisas Encontradas";

        for (const idProduto in catalogo) {
            const camisa = catalogo[idProduto];
            if (camisa.liga === ligaEscolhida) {
                vitrine.innerHTML += `
                    <div class="card">
                        <img src="${camisa.foto}" alt="${camisa.nome}">
                        <h3>${camisa.nome}</h3>
                        <p class="preco">${camisa.preco}</p>
                        <a href="produto.html?id=${idProduto}" class="btn-detalhes">Ver Detalhes</a>
                    </div>
                `;
            }
        }

        const numeroWhatsApp = "5546991087501"; 
        let carrinho = JSON.parse(localStorage.getItem('carrinhoDGSports')) || [];
        function atualizarContagem() { document.getElementById('contagem-carrinho').innerText = carrinho.length; }
        function abrirCarrinho() { document.getElementById('carrinho-modal').style.display = 'flex'; document.getElementById('fundo-escuro').style.display = 'block'; renderizarItens(); }
        function fecharCarrinho() { document.getElementById('carrinho-modal').style.display = 'none'; document.getElementById('fundo-escuro').style.display = 'none'; }
        function renderizarItens() {
            let listaHTML = '';
            if(carrinho.length === 0) { listaHTML = "<p>Seu carrinho está vazio.</p>"; } 
            else { carrinho.forEach((item, index) => { listaHTML += `<div class="item-cart"><div><strong>${item.nome}</strong><br>Tamanho: ${item.tamanho}</div><div><span style="color:red; cursor:pointer;" onclick="removerItem(${index})">Remover</span></div></div>`; }); }
            document.getElementById('lista-itens-carrinho').innerHTML = listaHTML;
        }
        function removerItem(index) { carrinho.splice(index, 1); localStorage.setItem('carrinhoDGSports', JSON.stringify(carrinho)); renderizarItens(); atualizarContagem(); }
        function finalizarCompraWhatsApp() {
            if (carrinho.length === 0) { alert("Adicione camisas ao carrinho antes de finalizar!"); return; }
            let textoMensagem = "Olá, DG Sports! Gostaria de finalizar meu pedido. Aqui estão as camisas:\n\n";
            carrinho.forEach((item, index) => { textoMensagem += `${index + 1}. *${item.nome}* (Tamanho: ${item.tamanho})\n`; });
            textoMensagem += "\nComo faço para realizar o pagamento?";
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(textoMensagem)}`, '_blank');
        }
        atualizarContagem();
    </script>
</body>
</html>
